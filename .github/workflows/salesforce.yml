name: Salesforce build

# Connects to the org with one secret: SFDX_AUTH_URL (see README "Connect GitHub to the org").
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        default: readiness
        options:
          - readiness        # phase 0: read-only check of what the org has turned on
          - validate         # check-only deploy, nothing changes in the org
          - deploy           # deploy force-app and assign the permission set
          - load             # run one loader step (pick it below)
          - load-all         # run every loader step in order
          - deploy-and-load  # deploy, then every loader step
          - test             # run the Mindbody Apex tests in the org (read-only for real data)
          - retrieve         # pull the pricing procedure, decision tables and context built in Setup (read-only)
          - explore          # read-only: print the org's standard pricing procedure, decision tables and pricing objects
          - explore-picklists  # read-only: print the standard picklists the build extends
          - cleanup          # DELETES the custom pieces replaced by standard features (manifest/cleanup)
          - ids              # read-only: print record Ids the pricing procedure metadata needs
          - explore-context  # read-only: print the sales transaction context at the org's API version
          - explore-recipe   # read-only: print the org's pricing recipes and their lookup-table mappings
          - explore-rules    # read-only: print a constraint model (CML) and the product qualification setup
          - delete           # DELETES what path names: a folder under manifest/ with package.xml + destructiveChanges.xml
          - cleanup-rule-library  # DELETES the leftover Mindbody_Product_Rules rule library definition
          - explore-qualification  # read-only: product qualification procedures, tables, context country attributes
          - usage-test  # CREATES a QuantumBit test account, quote and activated order (activates QB-DB products)
          - usage-summary  # CREATES usage records on the test asset and runs Create Usage Summary (step summary-only: job only)
          - explore-usage  # read-only: usage management setup (usage resources, rate cards, summaries)
          - describe-term  # read-only: term fields on Quote and Quote Line
          - explore-cml  # read-only: CML text of the active QuantumBit models and their product links
          - explore-constraints  # read-only: constraint models (CML), their versions, product links and the CML files
          - explore-rule-api  # read-only: configuration-rule permissions, invocable actions and Connect API resources
          - probe-config-rule  # changes nothing: test-insert a configuration rule and roll it back
      path:
        description: "Deploy / validate only this path – several paths comma-separated (default: all of force-app)"
        required: false
        default: force-app
      step:
        description: "Loader step (for action = load)"
        type: choice
        default: inventory
        options: [inventory, accounts, catalog, products, bundles, attributes, pricebooks, pricingschedules, constraints, constraints-reset, qualification, billing]
  pull_request:
    paths: ["force-app/**", "sfdx-project.json"]

permissions:
  contents: read

jobs:
  salesforce:
    runs-on: ubuntu-24.04
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      ACTION: ${{ github.event.inputs.action || 'validate' }}
      STEP: ${{ github.event.inputs.step }}
      DEPLOY_PATH: ${{ github.event.inputs.path || 'force-app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Stop if the org is not connected
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Add the repository secret SFDX_AUTH_URL first (README: Connect GitHub to the org)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli && sf --version

      - name: Log in to the org
        run: |
          echo "$SFDX_AUTH_URL" > authurl.txt
          sf org login sfdx-url --sfdx-url-file authurl.txt --alias target --set-default
          rm -f authurl.txt
          info=$(sf org display --target-org target --json)
          echo "$info" | jq '{username: .result.username, instanceUrl: .result.instanceUrl, apiVersion: .result.apiVersion}'
          # use the org's own (latest) API version for every retrieve and deploy: older versions do not know the
          # newest standard context attributes, and deploying an older shape reads as deleting them
          echo "ORG_API=$(echo "$info" | jq -r .result.apiVersion)" >> "$GITHUB_ENV"
          {
            echo "## Salesforce build – action: \`$ACTION\`"
            echo
            echo "Org: $(echo "$info" | jq -r .result.instanceUrl) as $(echo "$info" | jq -r .result.username)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Phase 0 readiness check
        if: env.ACTION == 'readiness'
        run: ./scripts/run-apex.sh scripts/apex/00_org_readiness.apex "Phase 0 – org readiness"

      - name: Validate (check-only deploy)
        if: env.ACTION == 'validate'
        run: |
          IFS=',' read -ra paths <<< "$DEPLOY_PATH"; dirs=(); for d in "${paths[@]}"; do dirs+=(--source-dir "$(echo "$d" | xargs)"); done
          sf project deploy start --dry-run --api-version "$ORG_API" "${dirs[@]}" --target-org target --test-level NoTestRun --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Validate (check-only)"

      - name: Deploy
        if: env.ACTION == 'deploy' || env.ACTION == 'deploy-and-load'
        run: |
          IFS=',' read -ra paths <<< "$DEPLOY_PATH"; dirs=(); for d in "${paths[@]}"; do dirs+=(--source-dir "$(echo "$d" | xargs)"); done
          sf project deploy start --api-version "$ORG_API" "${dirs[@]}" --target-org target --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Deploy"
          sf org assign permset --name Mindbody_ARM_Build --target-org target || echo "Permission set already assigned"

      - name: Run Apex tests
        if: env.ACTION == 'test'
        run: |
          sf apex run test --target-org target --class-names AccountHierarchyServiceTest --test-level RunSpecifiedTests \
            --wait 20 --result-format json > tests.json || true
          ./scripts/test-summary.sh tests.json

      - name: Retrieve pricing procedure from the org
        if: env.ACTION == 'retrieve'
        run: |
          mkdir -p retrieved
          manifest=manifest/pricing-procedure.xml
          case "$DEPLOY_PATH" in manifest/*.xml) manifest="$DEPLOY_PATH";; esac
          if [ "$manifest" = manifest/layouts.xml ] || [ "$manifest" = manifest/record-pages.xml ]; then
            echo "===== LAYOUT ASSIGNMENTS (System Administrator)"
            sf data query --use-tooling-api --query "SELECT TableEnumOrId, Layout.Name, RecordTypeId FROM ProfileLayout WHERE Profile.Name = 'System Administrator'" --target-org target --json \
              | jq -r '(.result.records // [])[] | "\(.TableEnumOrId) | \(.Layout.Name) | \(.RecordTypeId)"' | grep -E '^(Account|Opportunity|Quote|QuoteLineItem|Contract|Product2|ProductQualification|ContactPointAddress) ' || true
            echo "===== RECORD PAGES"
            sf data query --use-tooling-api --query "SELECT DeveloperName, EntityDefinitionId, Type FROM FlexiPage WHERE Type = 'RecordPage'" --target-org target --json \
              | jq -r '(.result.records // [])[] | "\(.EntityDefinitionId) | \(.DeveloperName)"' | grep -E '^(Account|Opportunity|Quote|QuoteLineItem|Contract|Product2|ProductQualification|ContactPointAddress) ' || true
          fi
          sf project retrieve start --api-version "$ORG_API" --manifest "$manifest" --target-org target \
            --target-metadata-dir retrieved --unzip --wait 20 --json > retrieve.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' retrieve.json
          files=$(find retrieved -type f ! -name '*.zip' | sort)
          echo "$files"
          # the files as one base64 tarball in the log, for sessions that cannot download artifacts
          echo "BEGIN_RETRIEVED_TGZ"; tar czf - retrieved | base64 -w 0; echo; echo "END_RETRIEVED_TGZ"
          {
            echo "### Retrieved from the org"
            echo
            if [ -n "$files" ]; then echo "$files" | sed 's/^/- /'; else echo "Nothing retrieved – check the names in manifest/pricing-procedure.xml"; fi
            jq -r '.result.messages // [] | .[] | "- ⚠️ \(.fileName // ""): \(.problem)"' retrieve.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retrieved metadata
        if: env.ACTION == 'retrieve'
        uses: actions/upload-artifact@v7
        with:
          name: retrieved-pricing-procedure
          path: retrieved
          if-no-files-found: warn

      - name: Explore standard pricing setup
        if: env.ACTION == 'explore'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_pricing.apex "Standard pricing objects" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --manifest manifest/explore-pricing.xml --target-org target \
            --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            # each file on ONE line (indentation and newlines removed), so the whole result fits in the log tail
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore standard picklists
        if: env.ACTION == 'explore-picklists'
        run: |
          mkdir -p explored
          sf project retrieve start --manifest manifest/explore-picklists.xml --target-org target \
            --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Upload explored metadata
        if: env.ACTION == 'explore'
        uses: actions/upload-artifact@v7
        with:
          name: explored-pricing-setup
          path: explored
          if-no-files-found: warn

      - name: Delete metadata listed in a manifest folder
        if: env.ACTION == 'delete'
        run: |
          case "$DEPLOY_PATH" in manifest/*) ;; *) echo "::error::path must be a folder under manifest/"; exit 1;; esac
          sf project deploy start --api-version "$ORG_API" --manifest "$DEPLOY_PATH/package.xml" \
            --post-destructive-changes "$DEPLOY_PATH/destructiveChanges.xml" \
            --target-org target --ignore-warnings --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Delete ($DEPLOY_PATH)"

      - name: Remove custom pieces replaced by standard features
        if: env.ACTION == 'cleanup'
        run: |
          sf project deploy start --manifest manifest/cleanup/package.xml \
            --post-destructive-changes manifest/cleanup/destructiveChanges.xml \
            --target-org target --ignore-warnings --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Cleanup (delete replaced custom pieces)"

      - name: Explore sales transaction context
        if: env.ACTION == 'explore-context'
        run: |
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata ContextDefinition:RLM_SalesTransactionContext --metadata ExpressionSetDefinition:RLM_DefaultPricingProcedure \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          echo "API version: $ORG_API"
          for f in $(find explored -type f \( -name '*.contextDefinition' -o -name '*.expressionSetDefinition' \) | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore pricing recipes
        if: env.ACTION == 'explore-recipe'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_recipe.apex "Pricing recipes" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata PricingRecipe \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' ! -name 'package.xml' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore rules setup
        if: env.ACTION == 'explore-rules'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_rules.apex "Rules setup" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata ExpressionSetDefinition:QuantumBitBundle \
            --metadata ExpressionSetDefinition:Server2 --metadata DecisionTable:RLM_ProductQualification \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' ! -name 'package.xml' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Remove leftover rule library definition
        if: env.ACTION == 'cleanup-rule-library'
        run: |
          sf project deploy start --api-version "$ORG_API" --manifest manifest/cleanup-rule-library/package.xml \
            --post-destructive-changes manifest/cleanup-rule-library/destructiveChanges.xml \
            --target-org target --ignore-warnings --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Remove leftover rule library definition"

      - name: Explore product qualification
        if: env.ACTION == 'explore-qualification'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_qualification.apex "Product qualification" || true
          names=$(sf data query --query "SELECT ApiName, UsageType, Name FROM ExpressionSet" --target-org target --json \
            | jq -r '[(.result.records // [])[] | select(((.UsageType // "") + " " + (.Name // "")) | test("ualif")) | .ApiName] | join(" ")')
          echo "===== DECISION TABLES"
          sf data query --use-tooling-api --query "SELECT DeveloperName, UsageType, Status FROM DecisionTable" --target-org target --json \
            | jq -r '(.result.records // [])[] | "\(.DeveloperName) | \(.UsageType) | \(.Status)"' || true
          echo "===== QUALIFICATION PROCEDURES: $names"
          rm -rf explored; mkdir -p explored
          args=""; for n in $names; do args="$args --metadata ExpressionSetDefinition:$n"; done
          [ -n "$args" ] && sf project retrieve start --api-version "$ORG_API" $args --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          for f in $(find explored -type f ! -name '*.zip' ! -name package.xml | sort); do
            echo "===== FILE $f"; sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n' | head -c 8000; echo
          done
          for m in DecisionTable:RLM_ProductQualification DecisionTable:RLM_ProductCategoryQualification ContextDefinition:RLM_ProductDiscoveryContext; do
            rm -rf explored; mkdir -p explored
            sf project retrieve start --api-version "$ORG_API" --metadata "$m" --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
            for f in $(find explored -type f ! -name '*.zip' ! -name package.xml | sort); do
              echo "===== FILE $f ($(wc -c < "$f") bytes)"
              if [[ "$f" == *contextDefinition ]]; then
                echo "-- nodes:"; grep -o '<title>[^<]*</title>' "$f" | sort -u | tr '\n' ' ' | head -c 3000; echo
                echo "-- country/region/account:"; grep -o '<contextAttribute>[^<]*</contextAttribute>\|<queryAttribute>[^<]*</queryAttribute>\|<objectName>[^<]*</objectName>' "$f" | sort -u | grep -i 'countr\|region\|account\|state\|object' | tr '\n' ' ' | head -c 3000; echo
              else
                sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n' | head -c 6000; echo
              fi
            done
          done
          echo "===== CONTEXT country / region attributes"
          grep -o '<name>[^<]*\(Country\|Region\|State\)[^<]*</name>' reference/RLM_SalesTransactionContext.contextDefinition | sort -u | head -40
          grep -o '<contextNodeName>[^<]*</contextNodeName>' reference/RLM_SalesTransactionContext.contextDefinition | sort -u | head -40

      - name: Usage test order
        if: env.ACTION == 'usage-test'
        run: ./scripts/usage/usage_test.sh

      - name: Usage summary test
        if: env.ACTION == 'usage-summary'
        run: |
          if [ "$DEPLOY_PATH" = "empty-summaries" ]; then ./scripts/usage/empty_summaries.sh
          elif [ "$DEPLOY_PATH" = "billing-check" ]; then ./scripts/usage/billing_check.sh
          elif [ "$DEPLOY_PATH" = "esv-check" ]; then ./scripts/usage/esv_check.sh
          elif [ "$DEPLOY_PATH" = "activate-v3" ]; then ./scripts/usage/activate_v3.sh
          elif [ "$DEPLOY_PATH" = "treatment-check" ]; then ./scripts/usage/treatment_check.sh
          elif [ "$DEPLOY_PATH" = "treatment-fix" ]; then ./scripts/usage/treatment_fix.sh
          elif [ "$DEPLOY_PATH" = "legal-check" ]; then ./scripts/usage/legal_check.sh
          elif [ "$DEPLOY_PATH" = "legal-policy" ]; then ./scripts/usage/legal_policy_test.sh
          elif [ "$DEPLOY_PATH" = "legal-flow-test" ]; then ./scripts/usage/legal_flow_test.sh
          elif [ "$DEPLOY_PATH" = "ui-quote-check" ]; then ./scripts/usage/ui_quote_check.sh
          elif [ "$DEPLOY_PATH" = "promo-check" ]; then ./scripts/usage/promo_check.sh
          elif [ "$DEPLOY_PATH" = "gpm-check" ]; then ./scripts/usage/gpm_check.sh
          elif [ "$DEPLOY_PATH" = "rulelib-check" ]; then ./scripts/usage/rulelib_check.sh
          elif [ "$DEPLOY_PATH" = "rulelib-activate" ]; then ./scripts/usage/rulelib_activate.sh
          elif [ "$DEPLOY_PATH" = "v4-check" ]; then ./scripts/usage/v4_check.sh
          elif [ "$DEPLOY_PATH" = "tier-check" ]; then ./scripts/usage/tier_check.sh
          elif [ "$DEPLOY_PATH" = "pricing-place" ]; then ./scripts/usage/pricing_place.sh
          elif [ "$DEPLOY_PATH" = "pricing-test" ]; then ./scripts/usage/pricing_test.sh
          elif [ "$DEPLOY_PATH" = "pricing-setup" ]; then ./scripts/usage/pricing_setup.sh
          elif [ "$DEPLOY_PATH" = "check-product" ]; then ./scripts/run-apex.sh scripts/usage/check_product.apex "Usage product setup" || true
          else ./scripts/usage/usage_summary.sh; fi

      - name: Explore usage setup
        if: env.ACTION == 'explore-usage'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_usage.apex "Usage setup" || true
          echo "===== STANDARD ACTIONS (usage / rating / journal)"
          sf api request rest "/services/data/v$ORG_API/actions/standard" --target-org target 2>/dev/null \
            | jq -r '.actions[]? | "\(.name) | \(.label)"' | grep -i 'usage\|rating\|rate\|journal\|consum\|entitle' || true
          echo "===== BATCH JOB DEFINITIONS"
          for o in BatchProcessJobDefinition BatchCalcJobDefinition BatchJobDefinition; do
            sf data query --use-tooling-api --query "SELECT DeveloperName, MasterLabel FROM $o" --target-org target --json 2>/dev/null \
              | jq -r --arg o "$o" '(.result.records // [])[] | "\($o) | \(.DeveloperName) | \(.MasterLabel)"' || true
          done
          for o in BatchJob BatchJobPart; do
            sf data query --query "SELECT Id, Status, CreatedDate FROM $o ORDER BY CreatedDate DESC LIMIT 5" --target-org target --json 2>/dev/null \
              | jq -r --arg o "$o" '(.result.records // [])[] | "\($o) | \(.Id) | \(.Status) | \(.CreatedDate)"' || true
          done
          echo "===== CONNECT RESOURCES"
          sf api request rest "/services/data/v$ORG_API/connect" --target-org target 2>/dev/null | jq -r 'to_entries[] | "\(.key) \(.value)"' | grep -i 'usage\|rating\|revenue\|rev' || true

      - name: Describe term fields
        if: env.ACTION == 'describe-term'
        run: ./scripts/run-apex.sh scripts/apex/describe_term_fields.apex "Term fields"

      - name: Explore CML of existing models
        if: env.ACTION == 'explore-cml'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_cml_links.apex "QuantumBit Bundle links" || true
          for v in QuantumBitBundle_V1 Server2_V1; do
            id=$(sf data query --use-tooling-api --query "SELECT Id FROM ExpressionSetDefinitionVersion WHERE DeveloperName = '$v'" \
              --target-org target --json | jq -r '.result.records[0].Id')
            echo "===== CML $v ($id)"
            sf api request rest "/services/data/v$ORG_API/tooling/sobjects/ExpressionSetDefinitionVersion/$id/ConstraintModel" \
              --target-org target > cml.txt 2>&1 || true
            wc -c < cml.txt
            head -c 12000 cml.txt; echo
            echo "===== END CML $v"
          done

      - name: Explore constraint models
        if: env.ACTION == 'explore-constraints'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_constraint_models.apex "Constraint models" || true
          echo "===== METADATA TYPES with Constraint/Expression"
          sf org list metadata-types --api-version "$ORG_API" --target-org target --json \
            | jq -r '.result.metadataObjects[] | .xmlName' | grep -iE 'constraint|expression|cml' | tr '\n' ' '; echo
          mkdir -p explored
          echo "===== TOOLING ExpressionSetDefinitionVersion fields"
          sf api request rest "/services/data/v$ORG_API/tooling/sobjects/ExpressionSetDefinitionVersion/describe" --target-org target 2>/dev/null \
            | jq -r '.fields[]? | "\(.name):\(.type):create=\(.createable):update=\(.updateable)"' | tr '\n' ' '; echo
          for o in ExpressionSetDefinition ExpressionSetVersion; do
            echo "===== TOOLING $o fields"
            sf api request rest "/services/data/v$ORG_API/tooling/sobjects/$o/describe" --target-org target 2>/dev/null \
              | jq -r '.fields[]? | "\(.name):\(.type)"' | tr '\n' ' '; echo
          done
          echo "===== TOOLING Server2_V1 record"
          sf api request rest "/services/data/v$ORG_API/tooling/query?q=SELECT+Id,DeveloperName,Metadata+FROM+ExpressionSetDefinitionVersion+WHERE+DeveloperName='Server2_V1'" \
            --target-org target 2>&1 | tr -d '\n' | head -c 6000; echo
          for m in 'ExpressionSetDefinitionVersion:QuantumBitBundle_V1' 'ExpressionSetDefinitionVersion:Server2_V1' 'ConstraintOptDef:*'; do
            echo "===== RETRIEVE $m"
            rm -rf explored; mkdir -p explored
            sf project retrieve start --api-version "$ORG_API" --metadata "$m" \
              --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
            jq -r '(.message // empty), (.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)")' explore.json
            for f in $(find explored -type f ! -name '*.zip' ! -name package.xml | sort); do
              echo "===== FILE $f ($(wc -c < "$f") bytes)"
              sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n' | head -c 6000
              echo
            done
          done

      - name: Explore configuration rule APIs
        if: env.ACTION == 'explore-rule-api'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_rule_permissions.apex "Configuration rule permissions" || true
          echo "===== STANDARD INVOCABLE ACTIONS matching rule/configur"
          sf api request rest "/services/data/v$ORG_API/actions/standard" --target-org target 2>/dev/null \
            | jq -r '.actions[]? | "\(.name) | \(.label)"' | grep -iE 'rule|configur' || echo "(none)"
          echo "===== CONNECT RESOURCES (top level)"
          sf api request rest "/services/data/v$ORG_API/connect" --target-org target 2>/dev/null | jq -c '.' | head -c 6000; echo
          for path in "connect/cpq/configurator" "connect/cpq" "connect/revenue-management" "connect/business-rules" "connect/product-configurator"; do
            echo "===== GET /$path"
            sf api request rest "/services/data/v$ORG_API/$path" --target-org target 2>&1 | tr -d '\n' | head -c 1500; echo
          done

      - name: Probe configuration rule
        if: env.ACTION == 'probe-config-rule'
        run: |
          ./scripts/run-apex.sh scripts/apex/probe_config_rule.apex "Configuration rule probe (rolled back)" || true
          echo "===== METADATA TYPES with Rule/Configurator"
          sf org list metadata-types --api-version "$ORG_API" --target-org target --json \
            | jq -r '.result.metadataObjects[] | .xmlName' | grep -iE 'rule|configurator|constraint' | tr '\n' ' '; echo
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata 'RuleLibraryDefinition:*' \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Show record Ids
        if: env.ACTION == 'ids'
        run: ./scripts/run-apex.sh scripts/apex/show_ids.apex "Record Ids"

      - name: Load one step
        if: env.ACTION == 'load'
        run: ./scripts/load.sh "$STEP"

      - name: Load every step
        if: env.ACTION == 'load-all' || env.ACTION == 'deploy-and-load'
        run: |
          for s in accounts catalog products bundles attributes pricebooks; do
            ./scripts/load.sh "$s"
          done
