name: Salesforce build

# Connects to the org with one secret: SFDX_AUTH_URL (see README "Connect GitHub to the org").
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to run"
        type: choice
        default: readiness
        options:
          - readiness        # phase 0: read-only check of what the org has turned on
          - validate         # check-only deploy, nothing changes in the org
          - deploy           # deploy force-app and assign the permission set
          - load             # run one loader step (pick it below)
          - load-all         # run every loader step in order
          - deploy-and-load  # deploy, then every loader step
          - test             # run the Mindbody Apex tests in the org (read-only for real data)
          - retrieve         # pull the pricing procedure, decision tables and context built in Setup (read-only)
          - explore          # read-only: print the org's standard pricing procedure, decision tables and pricing objects
          - explore-picklists  # read-only: print the standard picklists the build extends
          - cleanup          # DELETES the custom pieces replaced by standard features (manifest/cleanup)
          - ids              # read-only: print record Ids the pricing procedure metadata needs
          - explore-context  # read-only: print the sales transaction context at the org's API version
          - explore-recipe   # read-only: print the org's pricing recipes and their lookup-table mappings
          - explore-rules    # read-only: print a constraint model (CML) and the product qualification setup
          - cleanup-rule-library  # DELETES the leftover Mindbody_Product_Rules rule library definition
          - explore-constraints  # read-only: constraint models (CML), their versions, product links and the CML files
          - explore-rule-api  # read-only: configuration-rule permissions, invocable actions and Connect API resources
          - probe-config-rule  # changes nothing: test-insert a configuration rule and roll it back
      path:
        description: "Deploy / validate only this path – several paths comma-separated (default: all of force-app)"
        required: false
        default: force-app
      step:
        description: "Loader step (for action = load)"
        type: choice
        default: inventory
        options: [inventory, accounts, catalog, products, bundles, attributes, pricebooks, pricingschedules]
  pull_request:
    paths: ["force-app/**", "sfdx-project.json"]

permissions:
  contents: read

jobs:
  salesforce:
    runs-on: ubuntu-24.04
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
      ACTION: ${{ github.event.inputs.action || 'validate' }}
      STEP: ${{ github.event.inputs.step }}
      DEPLOY_PATH: ${{ github.event.inputs.path || 'force-app' }}
    steps:
      - uses: actions/checkout@v7

      - name: Stop if the org is not connected
        run: |
          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "::error::Add the repository secret SFDX_AUTH_URL first (README: Connect GitHub to the org)."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli && sf --version

      - name: Log in to the org
        run: |
          echo "$SFDX_AUTH_URL" > authurl.txt
          sf org login sfdx-url --sfdx-url-file authurl.txt --alias target --set-default
          rm -f authurl.txt
          info=$(sf org display --target-org target --json)
          echo "$info" | jq '{username: .result.username, instanceUrl: .result.instanceUrl, apiVersion: .result.apiVersion}'
          # use the org's own (latest) API version for every retrieve and deploy: older versions do not know the
          # newest standard context attributes, and deploying an older shape reads as deleting them
          echo "ORG_API=$(echo "$info" | jq -r .result.apiVersion)" >> "$GITHUB_ENV"
          {
            echo "## Salesforce build – action: \`$ACTION\`"
            echo
            echo "Org: $(echo "$info" | jq -r .result.instanceUrl) as $(echo "$info" | jq -r .result.username)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Phase 0 readiness check
        if: env.ACTION == 'readiness'
        run: ./scripts/run-apex.sh scripts/apex/00_org_readiness.apex "Phase 0 – org readiness"

      - name: Validate (check-only deploy)
        if: env.ACTION == 'validate'
        run: |
          IFS=',' read -ra paths <<< "$DEPLOY_PATH"; dirs=(); for d in "${paths[@]}"; do dirs+=(--source-dir "$(echo "$d" | xargs)"); done
          sf project deploy start --dry-run --api-version "$ORG_API" "${dirs[@]}" --target-org target --test-level NoTestRun --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Validate (check-only)"

      - name: Deploy
        if: env.ACTION == 'deploy' || env.ACTION == 'deploy-and-load'
        run: |
          IFS=',' read -ra paths <<< "$DEPLOY_PATH"; dirs=(); for d in "${paths[@]}"; do dirs+=(--source-dir "$(echo "$d" | xargs)"); done
          sf project deploy start --api-version "$ORG_API" "${dirs[@]}" --target-org target --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Deploy"
          sf org assign permset --name Mindbody_ARM_Build --target-org target || echo "Permission set already assigned"

      - name: Run Apex tests
        if: env.ACTION == 'test'
        run: |
          sf apex run test --target-org target --class-names AccountHierarchyServiceTest --test-level RunSpecifiedTests \
            --wait 20 --result-format json > tests.json || true
          ./scripts/test-summary.sh tests.json

      - name: Retrieve pricing procedure from the org
        if: env.ACTION == 'retrieve'
        run: |
          mkdir -p retrieved
          sf project retrieve start --api-version "$ORG_API" --manifest manifest/pricing-procedure.xml --target-org target \
            --target-metadata-dir retrieved --unzip --wait 20 --json > retrieve.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' retrieve.json
          files=$(find retrieved -type f ! -name '*.zip' | sort)
          echo "$files"
          {
            echo "### Retrieved from the org"
            echo
            if [ -n "$files" ]; then echo "$files" | sed 's/^/- /'; else echo "Nothing retrieved – check the names in manifest/pricing-procedure.xml"; fi
            jq -r '.result.messages // [] | .[] | "- ⚠️ \(.fileName // ""): \(.problem)"' retrieve.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload retrieved metadata
        if: env.ACTION == 'retrieve'
        uses: actions/upload-artifact@v7
        with:
          name: retrieved-pricing-procedure
          path: retrieved
          if-no-files-found: warn

      - name: Explore standard pricing setup
        if: env.ACTION == 'explore'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_pricing.apex "Standard pricing objects" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --manifest manifest/explore-pricing.xml --target-org target \
            --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            # each file on ONE line (indentation and newlines removed), so the whole result fits in the log tail
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore standard picklists
        if: env.ACTION == 'explore-picklists'
        run: |
          mkdir -p explored
          sf project retrieve start --manifest manifest/explore-picklists.xml --target-org target \
            --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Upload explored metadata
        if: env.ACTION == 'explore'
        uses: actions/upload-artifact@v7
        with:
          name: explored-pricing-setup
          path: explored
          if-no-files-found: warn

      - name: Remove custom pieces replaced by standard features
        if: env.ACTION == 'cleanup'
        run: |
          sf project deploy start --manifest manifest/cleanup/package.xml \
            --post-destructive-changes manifest/cleanup/destructiveChanges.xml \
            --target-org target --ignore-warnings --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Cleanup (delete replaced custom pieces)"

      - name: Explore sales transaction context
        if: env.ACTION == 'explore-context'
        run: |
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata ContextDefinition:RLM_SalesTransactionContext --metadata ExpressionSetDefinition:RLM_DefaultPricingProcedure \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          echo "API version: $ORG_API"
          for f in $(find explored -type f \( -name '*.contextDefinition' -o -name '*.expressionSetDefinition' \) | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore pricing recipes
        if: env.ACTION == 'explore-recipe'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_recipe.apex "Pricing recipes" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata PricingRecipe \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' ! -name 'package.xml' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Explore rules setup
        if: env.ACTION == 'explore-rules'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_rules.apex "Rules setup" || true
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata ExpressionSetDefinition:QuantumBitBundle \
            --metadata ExpressionSetDefinition:Server2 --metadata DecisionTable:RLM_ProductQualification \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' ! -name 'package.xml' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Remove leftover rule library definition
        if: env.ACTION == 'cleanup-rule-library'
        run: |
          sf project deploy start --api-version "$ORG_API" --manifest manifest/cleanup-rule-library/package.xml \
            --post-destructive-changes manifest/cleanup-rule-library/destructiveChanges.xml \
            --target-org target --ignore-warnings --wait 30 --json > result.json || true
          ./scripts/deploy-summary.sh result.json "Remove leftover rule library definition"

      - name: Explore constraint models
        if: env.ACTION == 'explore-constraints'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_constraint_models.apex "Constraint models" || true
          echo "===== METADATA TYPES with Constraint/Expression"
          sf org list metadata-types --api-version "$ORG_API" --target-org target --json \
            | jq -r '.result.metadataObjects[] | .xmlName' | grep -iE 'constraint|expression|cml' | tr '\n' ' '; echo
          mkdir -p explored
          for m in 'ExpressionSetDefinitionVersion:QuantumBitBundle_V1' 'ExpressionSetDefinitionVersion:Server2_V1' 'ConstraintOptDef:*'; do
            echo "===== RETRIEVE $m"
            rm -rf explored; mkdir -p explored
            sf project retrieve start --api-version "$ORG_API" --metadata "$m" \
              --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
            jq -r '(.message // empty), (.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)")' explore.json
            for f in $(find explored -type f ! -name '*.zip' ! -name package.xml | sort); do
              echo "===== FILE $f ($(wc -c < "$f") bytes)"
              sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n' | head -c 6000
              echo
            done
          done

      - name: Explore configuration rule APIs
        if: env.ACTION == 'explore-rule-api'
        run: |
          ./scripts/run-apex.sh scripts/apex/explore_rule_permissions.apex "Configuration rule permissions" || true
          echo "===== STANDARD INVOCABLE ACTIONS matching rule/configur"
          sf api request rest "/services/data/v$ORG_API/actions/standard" --target-org target 2>/dev/null \
            | jq -r '.actions[]? | "\(.name) | \(.label)"' | grep -iE 'rule|configur' || echo "(none)"
          echo "===== CONNECT RESOURCES (top level)"
          sf api request rest "/services/data/v$ORG_API/connect" --target-org target 2>/dev/null | jq -c '.' | head -c 6000; echo
          for path in "connect/cpq/configurator" "connect/cpq" "connect/revenue-management" "connect/business-rules" "connect/product-configurator"; do
            echo "===== GET /$path"
            sf api request rest "/services/data/v$ORG_API/$path" --target-org target 2>&1 | tr -d '\n' | head -c 1500; echo
          done

      - name: Probe configuration rule
        if: env.ACTION == 'probe-config-rule'
        run: |
          ./scripts/run-apex.sh scripts/apex/probe_config_rule.apex "Configuration rule probe (rolled back)" || true
          echo "===== METADATA TYPES with Rule/Configurator"
          sf org list metadata-types --api-version "$ORG_API" --target-org target --json \
            | jq -r '.result.metadataObjects[] | .xmlName' | grep -iE 'rule|configurator|constraint' | tr '\n' ' '; echo
          mkdir -p explored
          sf project retrieve start --api-version "$ORG_API" --metadata 'RuleLibraryDefinition:*' \
            --target-org target --target-metadata-dir explored --unzip --wait 20 --json > explore.json || true
          jq -r '.result.messages // [] | .[] | "WARNING \(.fileName // ""): \(.problem)"' explore.json
          for f in $(find explored -type f ! -name '*.zip' | sort); do
            echo "===== FILE $f"
            sed -e 's/^[[:space:]]*//' "$f" | grep -v '^<?xml' | tr -d '\r\n'
            echo
          done

      - name: Show record Ids
        if: env.ACTION == 'ids'
        run: ./scripts/run-apex.sh scripts/apex/show_ids.apex "Record Ids"

      - name: Load one step
        if: env.ACTION == 'load'
        run: ./scripts/load.sh "$STEP"

      - name: Load every step
        if: env.ACTION == 'load-all' || env.ACTION == 'deploy-and-load'
        run: |
          for s in accounts catalog products bundles attributes pricebooks; do
            ./scripts/load.sh "$s"
          done
